<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redis Matches Admin</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --ink: #0f1720;
      --muted: #4b5563;
      --line: #d8dee6;
      --accent: #0f766e;
      --accent-soft: #d5f4f0;
      --fail: #b91c1c;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #eef4f7 0%, #f6f8fa 100%);
      color: var(--ink);
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(15, 23, 32, 0.05);
    }
    h1, h2 { margin: 0 0 8px; }
    p { margin: 0; color: var(--muted); }
    .links, .pager {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .filter-group label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--muted);
    }
    .filter-group select {
      min-width: 220px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }
    .chip, button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: #0b5e58;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.86rem;
      cursor: pointer;
    }
    button[disabled] {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status { font-size: 0.92rem; color: var(--muted); }
    .error { color: var(--fail); font-weight: 700; }
    .match-list, .stack { display: grid; gap: 10px; }
    .match-card, .log-card {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      overflow: hidden;
    }
    .match-card-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 12px 12px 0;
    }
    .competition {
      font-size: 0.9rem;
      font-weight: 700;
      color: #0b5e58;
    }
    .subcategory {
      margin-top: 2px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .kickoff {
      margin-top: 4px;
      font-size: 0.8rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .select-control {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 600;
    }
    .match-link {
      display: block;
      text-decoration: none;
      color: inherit;
      padding: 12px;
    }
    .match-link:hover { background: rgba(15, 118, 110, 0.05); }
    .score-row {
      display: grid;
      grid-template-columns: 1fr auto auto auto 1fr;
      gap: 8px;
      align-items: center;
    }
    .team.home { text-align: right; font-weight: 700; }
    .team.away { text-align: left; font-weight: 700; }
    .score, .time {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .meta-card {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      background: #f9fbfc;
    }
    .meta-card .label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .meta-card .value {
      margin-top: 2px;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.25;
      word-break: break-word;
    }
    .log-card { padding: 12px; }
    .log-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      margin-bottom: 6px;
    }
    .muted { color: var(--muted); font-size: 0.86rem; }
    code, pre {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem;
    }
    pre {
      margin: 8px 0 0;
      padding: 10px;
      border-radius: 8px;
      background: #f8fafc;
      border: 1px solid var(--line);
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .hidden { display: none; }
    @media (max-width: 900px) {
      .meta-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 640px) {
      .meta-grid { grid-template-columns: 1fr; }
      .score-row { grid-template-columns: 1fr; text-align: left; }
      .team.home { text-align: left; }
    }
  </style>
</head>
<body>
  <div class="container">
    <section class="panel">
      <h1 id="title">Redis Matches</h1>
      <p id="subtitle">Canonical Redis-backed match state and write audit log.</p>
      <div class="links">
        <a class="chip" href="/admin/redis">Redis Overview</a>
        <a class="chip" href="/admin/fixtures">Fixtures</a>
        <a class="chip" href="/admin/results">Results</a>
        <a class="chip" href="/admin/status">Status</a>
      </div>
    </section>

    <section class="panel">
      <div id="status" class="status">Loading...</div>
    </section>

    <section id="list-view" class="panel hidden">
      <div class="toolbar">
        <div class="pager">
          <button id="prev-page">Previous</button>
          <button id="next-page">Next</button>
        </div>
        <div class="actions">
          <div class="filter-group">
            <label for="competition-filter">Competition</label>
            <select id="competition-filter">
              <option value="">All competitions</option>
            </select>
          </div>
          <button id="select-page">Select Page</button>
          <button id="clear-selection">Clear</button>
          <button id="delete-selected" disabled>Delete Selected</button>
          <button id="rescrape-selected" disabled>Rescrape Selected</button>
        </div>
      </div>
      <div id="list-summary" class="muted"></div>
      <div id="selection-summary" class="muted"></div>
      <div id="match-list" class="match-list"></div>
    </section>

    <section id="detail-view" class="panel hidden">
      <div class="links">
        <a class="chip" href="/admin/redis/matches">Back to Redis Matches</a>
      </div>
      <div id="detail-meta" class="meta-grid"></div>
    </section>

    <section id="detail-log-view" class="panel hidden">
      <h2>Write Log</h2>
      <div id="log-summary" class="muted"></div>
      <div id="log-list" class="stack"></div>
    </section>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const listView = document.getElementById("list-view");
    const detailView = document.getElementById("detail-view");
    const detailLogView = document.getElementById("detail-log-view");
    const matchListEl = document.getElementById("match-list");
    const listSummaryEl = document.getElementById("list-summary");
    const detailMetaEl = document.getElementById("detail-meta");
    const logListEl = document.getElementById("log-list");
    const logSummaryEl = document.getElementById("log-summary");
    const titleEl = document.getElementById("title");
    const subtitleEl = document.getElementById("subtitle");
    const prevPageButton = document.getElementById("prev-page");
    const nextPageButton = document.getElementById("next-page");
    const selectPageButton = document.getElementById("select-page");
    const clearSelectionButton = document.getElementById("clear-selection");
    const deleteSelectedButton = document.getElementById("delete-selected");
    const rescrapeSelectedButton = document.getElementById("rescrape-selected");
    const competitionFilterSelect = document.getElementById("competition-filter");
    const selectionSummaryEl = document.getElementById("selection-summary");
    const appBasePath = window.location.pathname.replace(/\/admin\/redis\/matches(?:\/.*)?$/, "");
    const selectedMatchIds = new Set();
    let currentListMatches = [];

    function withBasePath(path) {
      const normalizedPath = path.startsWith("/") ? path : `/${path}`;
      return `${appBasePath}${normalizedPath}`;
    }

    document.querySelectorAll("a[href]").forEach((link) => {
      const href = link.getAttribute("href");
      if (!href || !href.startsWith("/")) return;
      link.setAttribute("href", withBasePath(href));
    });

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function formatScore(match) {
      const home = match.home_score ?? "-";
      const away = match.away_score ?? "-";
      return `${home} - ${away}`;
    }

    function metaCard(label, value) {
      return `
        <div class="meta-card">
          <div class="label">${escapeHtml(label)}</div>
          <div class="value">${escapeHtml(value ?? "—")}</div>
        </div>
      `;
    }

    function formatKickoff(match) {
      const date = String(match && match.date ? match.date : "").trim();
      const time = String(match && match.time ? match.time : "").trim();
      if (date && time) return `${date} ${time}`;
      if (date) return date;
      if (time) return time;
      return "Kickoff unknown";
    }

    async function fetchJson(url, options = {}) {
      const response = await fetch(url, {
        cache: "no-store",
        ...options,
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(payload.error || payload.message || `Request failed (${response.status})`);
      }
      return payload;
    }

    function updateSelectionControls() {
      const count = selectedMatchIds.size;
      selectionSummaryEl.textContent =
        count > 0 ? `${count} match${count === 1 ? "" : "es"} selected` : "No matches selected";
      deleteSelectedButton.disabled = count === 0;
      rescrapeSelectedButton.disabled = count === 0;
    }

    function bindSelectionControls() {
      matchListEl.querySelectorAll("input[data-match-id]").forEach((input) => {
        input.addEventListener("change", (event) => {
          const matchId = event.target.getAttribute("data-match-id");
          if (!matchId) return;
          if (event.target.checked) {
            selectedMatchIds.add(matchId);
          } else {
            selectedMatchIds.delete(matchId);
          }
          updateSelectionControls();
        });
      });
    }

    async function performBulkAction(action) {
      const matchIds = Array.from(selectedMatchIds);
      if (matchIds.length === 0) return;

      const verb = action === "delete" ? "delete" : "rescrape";
      const confirmed = window.confirm(
        `Are you sure you want to ${verb} ${matchIds.length} selected match${matchIds.length === 1 ? "" : "es"}?`
      );
      if (!confirmed) return;

      statusEl.className = "status";
      statusEl.textContent = `${verb === "delete" ? "Deleting" : "Rescraping"} ${matchIds.length} selected matches...`;

      try {
        const payload = await fetchJson(withBasePath("/api/v1/admin/redis/matches/actions"), {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            action,
            match_ids: matchIds,
          }),
        });

        selectedMatchIds.clear();
        updateSelectionControls();
        const result = payload.result || {};
        if (action === "delete") {
          statusEl.textContent = `Deleted ${result.deleted || 0} match${result.deleted === 1 ? "" : "es"} from Redis`;
        } else {
          statusEl.textContent = `Rescraped ${result.refreshed_count || 0} match${result.refreshed_count === 1 ? "" : "es"} from BBC`;
        }
        await renderListView();
      } catch (error) {
        statusEl.className = "status error";
        statusEl.textContent = error && error.message ? error.message : String(error);
      }
    }

    async function renderListView() {
      listView.classList.remove("hidden");
      detailView.classList.add("hidden");
      detailLogView.classList.add("hidden");

      const params = new URLSearchParams(window.location.search);
      const page = Math.max(1, Number(params.get("page") || 1));
      const competitionFilter = params.get("competition") || "";
      const query = new URLSearchParams({
        page: String(page),
        page_size: "100",
      });
      if (competitionFilter) {
        query.set("competition", competitionFilter);
      }
      const payload = await fetchJson(withBasePath(`/api/v1/admin/redis/matches?${query.toString()}`));
      currentListMatches = Array.isArray(payload.matches) ? payload.matches : [];

      statusEl.textContent = `Redis source: ${payload.source || "unknown"} | Updated: ${payload.updated_at || "n/a"}`;
      listSummaryEl.textContent =
        `Showing page ${payload.page} of ${payload.total_pages || 1} | ${payload.total_count} matches` +
        (payload.competition_filter ? ` | Competition: ${payload.competition_filter}` : "");
      competitionFilterSelect.innerHTML = [
        '<option value="">All competitions</option>',
        ...(Array.isArray(payload.competition_options) ? payload.competition_options : []).map((competition) => {
          const selected = competition === competitionFilter ? " selected" : "";
          return `<option value="${escapeHtml(competition)}"${selected}>${escapeHtml(competition)}</option>`;
        }),
      ].join("");
      competitionFilterSelect.onchange = () => {
        const nextParams = new URLSearchParams(window.location.search);
        const nextCompetition = competitionFilterSelect.value || "";
        nextParams.delete("page");
        if (nextCompetition) {
          nextParams.set("competition", nextCompetition);
        } else {
          nextParams.delete("competition");
        }
        const queryString = nextParams.toString();
        window.location.search = queryString ? `?${queryString}` : "";
      };
      prevPageButton.disabled = payload.page <= 1;
      nextPageButton.disabled = !payload.has_more;
      prevPageButton.onclick = () => {
        const nextParams = new URLSearchParams(window.location.search);
        nextParams.set("page", String(Math.max(1, payload.page - 1)));
        window.location.search = `?${nextParams.toString()}`;
      };
      nextPageButton.onclick = () => {
        const nextParams = new URLSearchParams(window.location.search);
        nextParams.set("page", String(payload.page + 1));
        window.location.search = `?${nextParams.toString()}`;
      };
      selectPageButton.onclick = () => {
        currentListMatches.forEach((match) => {
          if (match && match.match_id) {
            selectedMatchIds.add(match.match_id);
          }
        });
        renderListView();
      };
      clearSelectionButton.onclick = () => {
        selectedMatchIds.clear();
        renderListView();
      };
      deleteSelectedButton.onclick = () => performBulkAction("delete");
      rescrapeSelectedButton.onclick = () => performBulkAction("rescrape");

      matchListEl.innerHTML = (payload.matches || []).map((match) => `
        <div class="match-card">
          <div class="match-card-head">
            <div>
              <div class="competition">${escapeHtml(match.league || "Unknown competition")}</div>
              <div class="subcategory">${escapeHtml(match.league_subcategory || "")}</div>
              <div class="kickoff">${escapeHtml(formatKickoff(match))}</div>
            </div>
            <label class="select-control">
              <input
                type="checkbox"
                data-match-id="${escapeHtml(match.match_id)}"
                ${selectedMatchIds.has(match.match_id) ? "checked" : ""}
              />
              Select
            </label>
          </div>
          <a class="match-link" href="${withBasePath(`/admin/redis/matches/${encodeURIComponent(match.match_id)}`)}">
            <div class="score-row">
              <div class="team home">${escapeHtml(match.home_team)}</div>
              <div class="score">${escapeHtml(match.home_score ?? "-")}</div>
              <div class="time">${escapeHtml(match.score_status || match.time || "—")}</div>
              <div class="score">${escapeHtml(match.away_score ?? "-")}</div>
              <div class="team away">${escapeHtml(match.away_team || "")}</div>
            </div>
          </a>
        </div>
      `).join("");
      bindSelectionControls();
      updateSelectionControls();
    }

    async function renderDetailView(matchId) {
      listView.classList.add("hidden");
      detailView.classList.remove("hidden");
      detailLogView.classList.remove("hidden");

      const payload = await fetchJson(withBasePath(`/api/v1/admin/redis/matches/${encodeURIComponent(matchId)}`));
      const match = payload.match || {};
      titleEl.textContent = `${match.home_team || "Match"} vs ${match.away_team || ""}`.trim();
      subtitleEl.textContent = `Canonical Redis match ${payload.match_id}`;
      statusEl.textContent = `Redis source: ${payload.source || "unknown"}`;

      detailMetaEl.innerHTML = [
        metaCard("Score", formatScore(match)),
        metaCard("Status", match.score_status || "—"),
        metaCard("Penalty Result", match.penalty_result || "—"),
        metaCard("Kickoff", `${match.date || "—"} ${match.time || ""}`.trim()),
        metaCard("Competition", match.league || "—"),
        metaCard("Subcategory", match.league_subcategory || "—"),
        metaCard("State Updated", match.updated_at || "—"),
        metaCard("Latest Write", payload.latest_write_at || "—"),
        metaCard("TV", (match.tv_channels || []).join(", ") || "—"),
      ].join("");

      const writeLog = payload.write_log || { entries: [] };
      logSummaryEl.textContent = `${writeLog.total || 0} write log entries`;
      logListEl.innerHTML = (writeLog.entries || []).map((entry) => `
        <div class="log-card">
          <div class="log-head">
            <strong>${escapeHtml(entry.written_at || "unknown")}</strong>
            <span class="muted">${escapeHtml(entry.source || "unknown")} / ${escapeHtml(entry.reason || "—")}</span>
          </div>
          <div class="muted">
            ${escapeHtml(entry.previous ? `${entry.previous.home_score ?? "-"}-${entry.previous.away_score ?? "-"} ${entry.previous.score_status || "—"}` : "no previous state")}
            →
            ${escapeHtml(entry.next ? `${entry.next.home_score ?? "-"}-${entry.next.away_score ?? "-"} ${entry.next.score_status || "—"}` : "no next state")}
          </div>
          <pre>${escapeHtml(JSON.stringify(entry, null, 2))}</pre>
        </div>
      `).join("");
    }

    async function main() {
      try {
        const detailMatch = window.location.pathname.match(/\/admin\/redis\/matches\/([^/?#]+)$/);
        const matchId = detailMatch ? decodeURIComponent(detailMatch[1]) : "";
        if (matchId) {
          await renderDetailView(matchId);
        } else {
          await renderListView();
        }
      } catch (error) {
        statusEl.className = "status error";
        statusEl.textContent = error.message || String(error);
      }
    }

    main();
  </script>
</body>
</html>
