<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match Audit Admin</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --ink: #0f1720;
      --muted: #4b5563;
      --line: #d8dee6;
      --accent: #0f766e;
      --accent-soft: #d5f4f0;
      --warn: #b45309;
      --critical: #b91c1c;
      --ok: #166534;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #eef4f7 0%, #f6f8fa 100%);
      color: var(--ink);
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(15, 23, 32, 0.05);
    }

    h1, h2 {
      margin: 0 0 8px;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    .toolbar, .filters, .links, .actions, .pager {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .toolbar {
      justify-content: space-between;
    }

    .chip, button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: #0b5e58;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.86rem;
      cursor: pointer;
    }

    button[disabled] {
      opacity: 0.5;
      cursor: not-allowed;
    }

    input, select {
      min-width: 180px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }

    .status {
      font-size: 0.92rem;
      color: var(--muted);
    }

    .error {
      color: var(--critical);
      font-weight: 700;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
    }

    .progress-shell {
      display: grid;
      gap: 10px;
    }

    .progress-track {
      width: 100%;
      height: 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #e7edf2;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0f766e 0%, #14b8a6 100%);
      transition: width 0.25s ease;
    }

    .progress-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }

    .meta-card {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #f9fbfc;
      padding: 10px;
    }

    .meta-card .label {
      font-size: 0.74rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .meta-card .value {
      margin-top: 4px;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.25;
    }

    .issue-list {
      display: grid;
      gap: 12px;
    }

    .issue-card {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .issue-card.warning {
      border-color: rgba(180, 83, 9, 0.28);
      background: rgba(251, 191, 36, 0.06);
    }

    .issue-card.critical {
      border-color: rgba(185, 28, 28, 0.28);
      background: rgba(248, 113, 113, 0.06);
    }

    .issue-head, .issue-foot {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .match-title {
      font-size: 1rem;
      font-weight: 700;
    }

    .match-subtitle {
      margin-top: 3px;
      font-size: 0.86rem;
      color: var(--muted);
    }

    .pill {
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 0.74rem;
      font-weight: 700;
      border: 1px solid var(--line);
      background: #fff;
      white-space: nowrap;
    }

    .pill.warning {
      border-color: rgba(180, 83, 9, 0.28);
      color: var(--warn);
      background: rgba(251, 191, 36, 0.12);
    }

    .pill.critical {
      border-color: rgba(185, 28, 28, 0.28);
      color: var(--critical);
      background: rgba(248, 113, 113, 0.12);
    }

    .pill.ok {
      border-color: rgba(22, 101, 52, 0.24);
      color: var(--ok);
      background: rgba(22, 101, 52, 0.10);
    }

    ul {
      margin: 0;
      padding-left: 18px;
      color: var(--ink);
    }

    li + li {
      margin-top: 6px;
    }

    .meta-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .meta-pill {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 8px;
      font-size: 0.84rem;
    }

    .muted {
      color: var(--muted);
    }

    .empty {
      padding: 10px 0;
      color: var(--muted);
    }

    @media (max-width: 1200px) {
      .summary-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 900px) {
      .meta-row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .summary-grid, .meta-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <section class="panel">
      <h1>Match Audit</h1>
      <p>Independent audit service for match state, finish-state, and match-details coverage.</p>
      <div class="links" style="margin-top: 10px;">
        <a id="healthcheck-link" class="chip" href="/api/v1/audit/healthcheck" target="_blank" rel="noopener noreferrer">Healthcheck</a>
        <a id="metrics-link" class="chip" href="/api/v1/audit/metrics" target="_blank" rel="noopener noreferrer">Metrics</a>
      </div>
    </section>

    <section class="panel">
      <div id="status" class="status">Loading audit report...</div>
      <div class="toolbar" style="margin-top: 12px;">
        <div class="filters">
          <select id="severity-filter">
            <option value="">All severities</option>
            <option value="critical">Critical</option>
            <option value="warning">Warning</option>
          </select>
          <select id="code-filter">
            <option value="">All issue codes</option>
          </select>
          <input id="search-filter" type="text" placeholder="team, league, match id">
        </div>
        <div class="actions">
          <button id="run-audit">Run Audit Now</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <div id="progress-panel" class="progress-shell"></div>
    </section>

    <section class="panel">
      <div id="summary-grid" class="summary-grid"></div>
    </section>

    <section class="panel">
      <div class="toolbar">
        <div>
          <h2 style="margin-bottom: 4px;">Matches With Potential Issues</h2>
          <p id="issue-summary">No audit data yet.</p>
        </div>
        <div class="pager">
          <button id="prev-page">Previous</button>
          <button id="next-page">Next</button>
        </div>
      </div>
      <div id="issue-list" class="issue-list" style="margin-top: 12px;"></div>
    </section>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const summaryGridEl = document.getElementById("summary-grid");
    const progressPanelEl = document.getElementById("progress-panel");
    const issueSummaryEl = document.getElementById("issue-summary");
    const issueListEl = document.getElementById("issue-list");
    const severityFilterEl = document.getElementById("severity-filter");
    const codeFilterEl = document.getElementById("code-filter");
    const searchFilterEl = document.getElementById("search-filter");
    const runAuditButton = document.getElementById("run-audit");
    const prevPageButton = document.getElementById("prev-page");
    const nextPageButton = document.getElementById("next-page");
    const healthcheckLinkEl = document.getElementById("healthcheck-link");
    const metricsLinkEl = document.getElementById("metrics-link");

    const PAGE_SIZE = 50;
    let currentReport = null;
    let filteredMatches = [];
    let currentPage = 1;

    function appBasePath() {
      const pathname = window.location.pathname || "";
      const adminIndex = pathname.indexOf("/admin/");
      if (adminIndex >= 0) {
        return pathname.slice(0, adminIndex) || "";
      }
      return "";
    }

    function auditApiBaseUrl() {
      return `${window.location.origin}${appBasePath()}/api/v1/audit`;
    }

    function upstreamAdminBaseUrl() {
      const root = currentReport && currentReport.config && currentReport.config.upstream_api_root
        ? String(currentReport.config.upstream_api_root)
        : `${window.location.origin}${appBasePath()}/api/v1`;
      return root.replace(/\/api\/v1\/?$/, "");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    async function fetchJson(url, options = {}) {
      const response = await fetch(url, {
        cache: "no-store",
        ...options,
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(payload.error || payload.message || `Request failed (${response.status})`);
      }
      return payload;
    }

    function metaCard(label, value) {
      return `
        <div class="meta-card">
          <div class="label">${escapeHtml(label)}</div>
          <div class="value">${escapeHtml(value)}</div>
        </div>
      `;
    }

    function formatPercent(ratio) {
      const safeRatio = Number.isFinite(Number(ratio)) ? Number(ratio) : 0;
      return `${(safeRatio * 100).toFixed(1)}%`;
    }

    function formatDecimal(value, digits = 2) {
      const numeric = Number(value);
      return Number.isFinite(numeric) ? numeric.toFixed(digits) : "0.00";
    }

    function renderProgress(payload) {
      const currentRun = payload && payload.current_run ? payload.current_run : null;
      if (!currentRun) {
        progressPanelEl.innerHTML = `<div class="empty">No audit run state available.</div>`;
        return;
      }
      const percent = Number.isFinite(Number(currentRun.progress_ratio))
        ? Math.max(0, Math.min(100, Number(currentRun.progress_ratio) * 100))
        : 0;
      const status = currentRun.status || (payload && payload.running ? "running" : "idle");
      const stage = currentRun.stage || "idle";
      progressPanelEl.innerHTML = `
        <div class="progress-meta">
          <div>
            <strong>Current Audit</strong>
            <span class="pill ${escapeHtml(status === "failed" ? "critical" : status === "running" ? "warning" : "ok")}">${escapeHtml(status)}</span>
            <span class="muted">stage ${escapeHtml(stage)}</span>
          </div>
          <div class="muted">
            ${escapeHtml(String(currentRun.matches_audited || 0))} / ${escapeHtml(String(currentRun.total_matches || 0))}
            matches | ${escapeHtml(formatPercent(currentRun.progress_ratio || 0))}
            | ${escapeHtml(formatDecimal(currentRun.matches_per_second || 0))} matches/s
          </div>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width: ${percent.toFixed(1)}%;"></div>
        </div>
        <div class="meta-row">
          <div class="meta-pill"><strong>Started</strong><br>${escapeHtml(currentRun.started_at || "—")}</div>
          <div class="meta-pill"><strong>Last Progress</strong><br>${escapeHtml(currentRun.last_progress_at || "—")}</div>
          <div class="meta-pill"><strong>Detail Checks</strong><br>${escapeHtml(String(currentRun.detail_checks_completed || 0))} / ${escapeHtml(String(currentRun.detail_candidates || 0))}</div>
          <div class="meta-pill"><strong>Issues Found</strong><br>${escapeHtml(String(currentRun.issues_found || 0))}</div>
        </div>
      `;
    }

    function issueCodeOptions(report) {
      const codes = new Set();
      (report && Array.isArray(report.matches) ? report.matches : []).forEach((match) => {
        (Array.isArray(match.issues) ? match.issues : []).forEach((issue) => {
          if (issue && issue.code) {
            codes.add(String(issue.code));
          }
        });
      });
      return Array.from(codes).sort((left, right) => left.localeCompare(right));
    }

    function renderSummary(report) {
      const summary = report.summary || {};
      summaryGridEl.innerHTML = [
        metaCard("Matches Checked", summary.matches_checked || 0),
        metaCard("Started Matches", summary.started_matches || 0),
        metaCard("Expected Finished", summary.finished_expected_matches || 0),
        metaCard("Detail Candidates", summary.detail_candidates || 0),
        metaCard("Matches With Issues", summary.matches_with_issues || 0),
        metaCard("Issues Total", summary.issues_total || 0),
      ].join("");
    }

    function applyFilters() {
      if (!currentReport) {
        filteredMatches = [];
        return;
      }
      const severity = (severityFilterEl.value || "").toLowerCase();
      const code = (codeFilterEl.value || "").toLowerCase();
      const search = (searchFilterEl.value || "").trim().toLowerCase();

      filteredMatches = (Array.isArray(currentReport.matches) ? currentReport.matches : []).filter((match) => {
        const issues = Array.isArray(match.issues) ? match.issues : [];
        if (severity && !issues.some((issue) => String(issue.severity || "").toLowerCase() === severity)) {
          return false;
        }
        if (code && !issues.some((issue) => String(issue.code || "").toLowerCase() === code)) {
          return false;
        }
        if (search) {
          const haystack = [
            match.match_id,
            match.audit_match_id,
            match.date,
            match.time,
            match.league,
            match.home_team,
            match.away_team,
            match.score_status,
            ...issues.map((issue) => `${issue.code} ${issue.message}`),
          ]
            .map((value) => String(value || "").toLowerCase())
            .join(" ");
          if (!haystack.includes(search)) {
            return false;
          }
        }
        return true;
      });
      currentPage = Math.max(1, Math.min(currentPage, Math.ceil(filteredMatches.length / PAGE_SIZE) || 1));
      renderMatches();
    }

    function currentPageItems() {
      const start = (currentPage - 1) * PAGE_SIZE;
      return filteredMatches.slice(start, start + PAGE_SIZE);
    }

    async function rescrapeMatch(matchId) {
      if (!matchId) return;
      const confirmed = window.confirm(`Trigger a manual BBC re-scrape for ${matchId}?`);
      if (!confirmed) return;

      statusEl.className = "status";
      statusEl.textContent = `Rescraping ${matchId}...`;
      try {
        await fetchJson(`${auditApiBaseUrl()}/matches/${encodeURIComponent(matchId)}/rescrape`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
        });
        await loadReport();
        statusEl.textContent = `Rescrape queued for ${matchId}. Audit snapshot refreshed.`;
      } catch (error) {
        statusEl.className = "status error";
        statusEl.textContent = error && error.message ? error.message : String(error);
      }
    }

    function renderMatches() {
      const items = currentPageItems();
      const totalPages = filteredMatches.length > 0 ? Math.ceil(filteredMatches.length / PAGE_SIZE) : 0;
      issueSummaryEl.textContent =
        `Showing ${items.length} of ${filteredMatches.length} filtered matches with issues` +
        (totalPages > 0 ? ` | Page ${currentPage} of ${totalPages}` : "");

      prevPageButton.disabled = currentPage <= 1;
      nextPageButton.disabled = currentPage >= totalPages;

      if (items.length === 0) {
        issueListEl.innerHTML = `<div class="empty">No matches match the current filters.</div>`;
        return;
      }

      issueListEl.innerHTML = items.map((match) => {
        const issues = Array.isArray(match.issues) ? match.issues : [];
        const adminBaseUrl = upstreamAdminBaseUrl();
        const bbcUrl = match.match_id
          ? `https://www.bbc.co.uk/sport/football/live/${encodeURIComponent(match.match_id)}`
          : null;
        const redisUrl = match.match_id
          ? `${adminBaseUrl}/admin/redis/matches/${encodeURIComponent(match.match_id)}`
          : null;

        return `
          <div class="issue-card ${escapeHtml(match.highest_severity || "warning")}">
            <div class="issue-head">
              <div>
                <div class="match-title">${escapeHtml(match.home_team || "Unknown")} vs ${escapeHtml(match.away_team || "Unknown")}</div>
                <div class="match-subtitle">
                  ${escapeHtml(match.league || "Unknown competition")} |
                  ${escapeHtml(match.date || "—")} ${escapeHtml(match.time || "")} |
                  status ${escapeHtml(match.score_status || "—")}
                  ${match.match_id ? `| id ${escapeHtml(match.match_id)}` : ""}
                </div>
              </div>
              <span class="pill ${escapeHtml(match.highest_severity || "warning")}">${escapeHtml(match.highest_severity || "warning")}</span>
            </div>
            <div class="meta-row">
              <div class="meta-pill"><strong>Score</strong><br>${escapeHtml(match.home_score ?? "-")} - ${escapeHtml(match.away_score ?? "-")}</div>
              <div class="meta-pill"><strong>Should Have Kicked Off</strong><br>${match.should_have_kicked_off ? "Yes" : "No"}</div>
              <div class="meta-pill"><strong>Should Be Finished</strong><br>${match.should_be_finished ? "Yes" : "No"}</div>
              <div class="meta-pill"><strong>Detail Candidate</strong><br>${match.should_have_detail_payload ? "Yes" : "No"}</div>
            </div>
            <ul>
              ${issues.map((issue) => `
                <li>
                  <span class="pill ${escapeHtml(issue.severity || "warning")}">${escapeHtml(issue.code || "issue")}</span>
                  <span class="muted">${escapeHtml(issue.message || "")}</span>
                </li>
              `).join("")}
            </ul>
            <div class="issue-foot">
              <div class="links">
                ${redisUrl ? `<a class="chip" href="${escapeHtml(redisUrl)}" target="_blank" rel="noopener noreferrer">Redis Match</a>` : ""}
                ${bbcUrl ? `<a class="chip" href="${escapeHtml(bbcUrl)}" target="_blank" rel="noopener noreferrer">BBC Match</a>` : ""}
              </div>
              <div class="actions">
                <button ${match.match_id ? "" : "disabled"} data-rescrape="${escapeHtml(match.match_id || "")}">Re-scrape BBC</button>
              </div>
            </div>
          </div>
        `;
      }).join("");

      issueListEl.querySelectorAll("button[data-rescrape]").forEach((button) => {
        button.addEventListener("click", () => {
          const matchId = button.getAttribute("data-rescrape");
          void rescrapeMatch(matchId);
        });
      });
    }

    async function loadReport() {
      statusEl.className = "status";
      statusEl.textContent = "Loading audit report...";
      const payload = await fetchJson(`${auditApiBaseUrl()}/summary?limit=1000`);
      currentReport = payload.report || null;

      const codes = issueCodeOptions(currentReport);
      codeFilterEl.innerHTML = [
        '<option value="">All issue codes</option>',
        ...codes.map((code) => `<option value="${escapeHtml(code)}">${escapeHtml(code)}</option>`),
      ].join("");

      renderProgress(payload || {});
      renderSummary(currentReport || {});
      applyFilters();

      statusEl.textContent =
        `Last success: ${payload.last_success_at || "n/a"} | ` +
        `Report: ${currentReport && currentReport.generated_at ? currentReport.generated_at : "n/a"} | ` +
        `Running: ${payload.running ? "yes" : "no"} | ` +
        `Progress: ${(payload.current_run && payload.current_run.matches_audited) || 0}/${(payload.current_run && payload.current_run.total_matches) || 0}`;
    }

    severityFilterEl.addEventListener("change", applyFilters);
    codeFilterEl.addEventListener("change", applyFilters);
    searchFilterEl.addEventListener("input", applyFilters);
    prevPageButton.addEventListener("click", () => {
      currentPage = Math.max(1, currentPage - 1);
      renderMatches();
    });
    nextPageButton.addEventListener("click", () => {
      currentPage += 1;
      renderMatches();
    });
    runAuditButton.addEventListener("click", async () => {
      statusEl.className = "status";
      statusEl.textContent = "Running audit...";
      try {
        await fetchJson(`${auditApiBaseUrl()}/run`, { method: "POST" });
        await loadReport();
      } catch (error) {
        statusEl.className = "status error";
        statusEl.textContent = error && error.message ? error.message : String(error);
      }
    });

    healthcheckLinkEl.href = `${auditApiBaseUrl()}/healthcheck`;
    metricsLinkEl.href = `${auditApiBaseUrl()}/metrics`;

    void loadReport().catch((error) => {
      statusEl.className = "status error";
      statusEl.textContent = error && error.message ? error.message : String(error);
    });
  </script>
</body>
</html>
