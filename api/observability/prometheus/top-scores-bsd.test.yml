{
  "rule_files": [
    "top-scores-bsd.yml"
  ],
  "evaluation_interval": "1m",
  "tests": [
    {
      "name": "first 429 failure is detected without a zero baseline and resolves",
      "interval": "1m",
      "input_series": [
        {
          "series": "top_scores_bsd_http_requests_total{job=\"top-scores\",status_code=\"429\",source=\"bsd_events_live\",instance=\"bsd\"}",
          "values": "_ 1+0x15"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "1m",
          "alertname": "TopScoresBSDUpstreamErrors",
          "exp_alerts": []
        },
        {
          "eval_time": "2m",
          "alertname": "TopScoresBSDUpstreamErrors",
          "exp_alerts": [
            {
              "exp_labels": {
                "job": "top-scores",
                "status_code": "429",
                "service_name": "top-scores",
                "severity": "warning"
              },
              "exp_annotations": {
                "summary": "Top Scores: BSD upstream failures (status 429)",
                "description": "BSD requests failed within the last 10 minutes. Status 0 means a connection failure or timeout; 429 means throttling or quota exhaustion; 401/403 means authentication or access failure; 5xx means an upstream server error. Scores and Live Activities may be stale. Check BSD account quota and top-scores-bsd.error.log; break down top_scores_bsd_http_requests_total by source. HTTP 404 is excluded because optional lookups may be missing."
              }
            }
          ]
        },
        {
          "eval_time": "12m",
          "alertname": "TopScoresBSDUpstreamErrors",
          "exp_alerts": []
        }
      ]
    },
