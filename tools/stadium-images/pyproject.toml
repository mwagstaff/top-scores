[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "top-scores-stadium-images"
version = "0.1.0"
description = "Licence-aware stadium image collector for Top Scores"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "ImageHash>=4.3,<5",
  "Pillow>=11,<13",
  "PyYAML>=6,<7",
  "rich>=13,<15",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
]

[project.scripts]
stadium-images = "stadium_images.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff.lint]
ignore = ["B008"]
