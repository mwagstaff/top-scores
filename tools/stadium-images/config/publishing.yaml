schema_version: 1

# Created by collector/promote_reviewed.py after human review. It is optional
# so the bundled fallback catalogue can still be published on a clean checkout.
optional_include_files:
  - tools/stadium-images/collector/deployment/publishing.yaml

# Every remote image must retain enough information to render its credit in
# Profile > About > Data sources > Image credits. Override this block per asset
# when publishing third-party photography from the collector output.
credit_defaults:
  author: Top Scores
  source: Top Scores
  license: Top Scores artwork
  attribution: Top Scores artwork

teams:
